<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>添加人工客服 — 虚空搜索 XuSearch</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070710'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%238B5CF6' stroke-width='3.5'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%2322D3EE'/%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      color: #F2F2F6;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background:
        radial-gradient(900px 600px at 15% -10%, rgba(139, 92, 246, 0.16), transparent 65%),
        radial-gradient(800px 520px at 90% 5%, rgba(34, 211, 238, 0.10), transparent 62%),
        #040407;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 26px;
      color: #9E9EB2;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .brand .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: linear-gradient(120deg, #8B5CF6, #22D3EE);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .sub { margin: 0 0 28px; font-size: 14px; color: #9E9EB2; line-height: 1.7; }
    .qr {
      display: inline-block;
      padding: 16px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 26px 60px -26px rgba(0, 0, 0, 0.9);
    }
    .qr img {
      display: block;
      width: 264px;
      max-width: 74vw;
      height: auto;
      border-radius: 6px;
    }
    .note { margin: 20px 0 0; font-size: 12.5px; color: #5E5E74; }
    .back {
      display: inline-block;
      margin-top: 30px;
      font-size: 13px;
      color: #9E9EB2;
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      transition: color 0.25s ease, border-color 0.25s ease;
    }
    .back:hover { color: #A78BFA; border-color: #A78BFA; }
  </style>
</head>
<body>
  <main class="card">
    <span class="brand"><span class="dot"></span>虚空搜索 · XuSearch</span>
    <h1>添加人工客服</h1>
    <p class="sub">请使用微信扫描下方二维码添加企业微信客服</p>

    <div class="qr">
      <img src="https://wework.qpic.cn/wwpic3az/987551_4SWZ-bE8Rt6jEhj_1791965910/0" alt="人工客服二维码" />
    </div>

    <p class="note">长按或截图后，用微信「扫一扫」识别</p>
    <a class="back" href="./">← 返回官网</a>
  </main>
</body>
</html>
